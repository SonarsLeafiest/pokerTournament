<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poker Tournament — Live</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0d0d0d;
      color: #ddd;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      background: #111;
      border-bottom: 1px solid #1e1e1e;
    }
    #title { color: #f0c040; font-size: 1.1rem; letter-spacing: 3px; }
    #conn { font-size: 0.72rem; }
    #conn.on  { color: #4c4; }
    #conn.off { color: #c44; }

    /* ── Table area ──────────────────────────────────────────────────────── */
    #table-area {
      position: relative;
      max-width: 1000px;
      height: 560px;
      margin: 20px auto;
      overflow: visible;
    }

    /* ── Felt ────────────────────────────────────────────────────────────── */
    #felt {
      position: absolute;
      inset: 105px 115px;
      background: radial-gradient(ellipse at 50% 50%,
        #2a7a2a 0%, #1d621d 52%, #0f400f 100%);
      border-radius: 50%;
      border: 14px solid #5c3410;
      box-shadow:
        0 0 0 3px #8a5520,
        inset 0 0 100px rgba(0,0,0,0.35),
        0 10px 50px rgba(0,0,0,0.8);
    }

    /* ── Table center ────────────────────────────────────────────────────── */
    #table-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      min-width: 280px;
    }
    #stage-label {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #community-cards {
      display: flex;
      gap: 7px;
      justify-content: center;
      min-height: 58px;
      margin-bottom: 10px;
    }
    #pot-display {
      color: #f0c040;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* ── Cards ───────────────────────────────────────────────────────────── */
    .card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.65);
      flex-shrink: 0;
      user-select: none;
    }
    .card.red   { color: #c91212; }
    .card.black { color: #111; }
    .card.back  {
      background: repeating-linear-gradient(
        45deg,
        #1a2060 0px, #1a2060 4px,
        #101540 4px, #101540 8px
      );
    }

    /* Community card */
    .c-card { width: 44px; height: 60px; font-size: 0.85rem; gap: 1px; }
    .c-card .r { font-size: 1.05rem; line-height: 1; }
    .c-card .s { font-size: 0.8rem;  line-height: 1; }

    /* Hole card (in seats) */
    .h-card { width: 28px; height: 40px; }
    .h-card .r { font-size: 0.72rem; line-height: 1.1; }
    .h-card .s { font-size: 0.6rem;  line-height: 1; }

    /* ── Seats ───────────────────────────────────────────────────────────── */
    .seat {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 122px;
      text-align: center;
      z-index: 10;
    }
    .seat-box {
      background: rgba(10, 10, 16, 0.9);
      border: 1px solid #2e2e3a;
      border-radius: 8px;
      padding: 7px 8px 5px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .seat-box.acting {
      border-color: #f0c040;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .seat-box.folded        { opacity: 0.32; }
    .seat-box.disconnected  { border-color: #a03030; opacity: 0.55; }
    .seat-dc { font-size: 0.55rem; color: #c44; margin-top: 1px; }
    .seat-box.waiting { border-color: #444; opacity: 0.65; }
    .seat-waiting { font-size: 0.55rem; color: #555; margin-top: 2px; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 8px  rgba(240,192,64,0.5); }
      50%       { box-shadow: 0 0 22px rgba(240,192,64,1);   }
    }

    .seat-name {
      font-size: 0.6rem;
      color: #bbb;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 2px;
    }
    .dealer-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px; height: 14px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      font-size: 0.48rem;
      font-weight: bold;
      margin-left: 3px;
      vertical-align: middle;
    }
    .seat-stack { font-size: 0.8rem; font-weight: bold; color: #f0c040; }
    .seat-bet   { font-size: 0.6rem; color: #888; min-height: 13px; }
    .seat-cards { display: flex; gap: 3px; justify-content: center; margin: 4px 0 3px; }
    .seat-action { font-size: 0.58rem; min-height: 12px; color: #555; }
    .seat-action.fold  { color: #484848; }
    .seat-action.call  { color: #4af; }
    .seat-action.check { color: #5d5; }
    .seat-action.raise { color: #f90; font-weight: bold; }

    /* ── Waiting state ───────────────────────────────────────────────────── */
    #waiting {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.15);
      font-size: 0.75rem;
      letter-spacing: 2px;
      pointer-events: none;
    }

    /* ── Table sidebar ───────────────────────────────────────────────────── */
    /* Wraps the bounty bar, felt, and blinds label so the sidebar can be
       absolutely positioned to the left of the 1000px centered area. */
    #main-content {
      position: relative;
      max-width: 1000px;
      margin: 0 auto;
    }

    #table-sidebar {
      position: absolute;
      /* 12px gap to the left of #main-content's left edge */
      right: calc(100% + 12px);
      top: 8px;
      width: 110px;
      display: none;
    }
    #table-sidebar.show { display: block; }

    .tl-header {
      font-size: 0.5rem;
      color: #2a2a2a;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #191919;
    }

    .table-list-item {
      padding: 9px 10px;
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: border-color 0.15s, background 0.15s;
    }
    .table-list-item.active {
      border-color: #f0c040;
      background: #1e1c0e;
    }
    .table-list-item:hover:not(.active) { border-color: #444; background: #1a1a1a; }

    .tli-name {
      font-size: 0.68rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: #f0c040;
    }
    .tli-name.dim { color: #555; }
    .tli-players { font-size: 0.58rem; color: #3a3a3a; margin-top: 3px; }

    /* ── Hand banner ─────────────────────────────────────────────────────── */
    #hand-banner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      font-weight: bold;
      color: #f0c040;
      letter-spacing: 4px;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 0 24px rgba(240,192,64,0.9);
      animation: hand-fadeout 1.4s ease-out forwards;
    }
    @keyframes hand-fadeout {
      0%, 40% { opacity: 1; }
      100%     { opacity: 0; }
    }

    /* ── Blinds label ────────────────────────────────────────────────────── */
    #blinds-label {
      text-align: center;
      font-size: 0.65rem;
      color: #3a3a3a;
      margin-top: -6px;
      margin-bottom: 10px;
    }

    /* ── Bottom panels ───────────────────────────────────────────────────── */
    #bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 1000px;
      margin: 0 auto 28px;
      padding: 0 20px;
    }
    .panel {
      background: #141414;
      border: 1px solid #202020;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .panel h2 {
      font-size: 0.6rem;
      color: #3a3a3a;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    #standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    #standings-table th {
      text-align: left;
      color: #333;
      padding: 2px 6px;
      border-bottom: 1px solid #1e1e1e;
      font-weight: normal;
    }
    #standings-table td { padding: 4px 6px; border-bottom: 1px solid #191919; }
    #standings-table tr.leader td { color: #f0c040; }
    #standings-table tr.out    td { color: #2a2a2a; text-decoration: line-through; }

    #log { height: 168px; overflow-y: auto; font-size: 0.68rem; }
    .log-row        { padding: 3px 0; border-bottom: 1px solid #191919; color: #484848; }
    .log-row.win    { color: #3a3; }
    .log-row.action { color: #555; }

    /* ── Bounty bar ─────────────────────────────────────────────────────── */
    #bounty-bar {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 14px;
      max-width: 1000px;
      margin: 8px auto 0;
      padding: 9px 20px;
      background: #1a0a0a;
      border: 1px solid #8b1a1a;
      border-radius: 6px;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }
    #bounty-bar.show { display: flex; }
    #bounty-icon  { font-size: 1.1rem; }
    #bounty-label { color: #c44; font-weight: bold; text-transform: uppercase; }
    #bounty-name  { color: #f0c040; font-weight: bold; }
    #bounty-reward-text { color: #888; }
    #bounty-hands { color: #555; font-size: 0.68rem; }
    .seat-box.bounty-target { border-color: #c44 !important; box-shadow: 0 0 12px rgba(192,64,64,0.5); }

    /* ── Bounty claim / expire banner ───────────────────────────────────── */
    #bounty-event-banner {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 4, 4, 0.94);
      border: 2px solid #c44;
      border-radius: 12px;
      padding: 28px 48px;
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }
    #bounty-event-banner.claimed { border-color: #c44; }
    #bounty-event-banner.expired { border-color: #444; }
    #beb-icon   { font-size: 2rem; line-height: 1; }
    #beb-title  { font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; margin: 6px 0 4px; }
    #beb-name   { font-size: 1.4rem; font-weight: bold; letter-spacing: 2px; }
    #beb-detail { font-size: 0.75rem; color: #888; margin-top: 6px; letter-spacing: 1px; }
    #bounty-event-banner.claimed #beb-title { color: #c44; }
    #bounty-event-banner.claimed #beb-name  { color: #f0c040; }
    #bounty-event-banner.expired #beb-title { color: #555; }
    #bounty-event-banner.expired #beb-name  { color: #444; }
    @keyframes beb-fadeout {
      0%, 55% { opacity: 1; }
      100%     { opacity: 0; }
    }

    /* ── Table winner banner ─────────────────────────────────────────────── */
    #table-winner-banner {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 10, 0.92);
      border: 2px solid #f0c040;
      border-radius: 12px;
      padding: 28px 48px;
      text-align: center;
      pointer-events: none;
      z-index: 100;
      animation: twb-fadeout 3.5s ease-out forwards;
    }
    #table-winner-banner .twb-trophy { font-size: 2rem; line-height: 1; }
    #table-winner-banner .twb-table  { font-size: 0.65rem; color: #666; letter-spacing: 3px; text-transform: uppercase; margin: 6px 0 4px; }
    #table-winner-banner .twb-name   { font-size: 1.6rem; font-weight: bold; color: #f0c040; letter-spacing: 2px; }
    #table-winner-banner .twb-sub    { font-size: 0.7rem; color: #555; margin-top: 6px; letter-spacing: 1px; }
    @keyframes twb-fadeout {
      0%, 55% { opacity: 1; }
      100%     { opacity: 0; }
    }

    /* ── Countdown overlay ───────────────────────────────────────────────── */
    #countdown-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #countdown-overlay.show { display: flex; }
    #cd-num    { font-size: 12rem; font-weight: bold; color: #f0c040; line-height: 1; }
    #cd-label  { color: #666; font-size: 0.9rem; letter-spacing: 4px; margin-top: 14px; }
    #cd-agents { color: #3a3a3a; font-size: 0.75rem; margin-top: 8px; }

    /* ── Winner overlay ──────────────────────────────────────────────────── */
    #winner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #winner-overlay.show { display: flex; }
    #winner-trophy  { font-size: 5rem; animation: trophy-bounce 1s ease-in-out infinite alternate; }
    #winner-label   { font-size: 0.75rem; color: #888; letter-spacing: 4px; text-transform: uppercase; margin-top: 18px; }
    #winner-name    { font-size: 3rem; font-weight: bold; color: #f0c040; margin-top: 10px; letter-spacing: 2px; }
    #winner-stack   { font-size: 1rem; color: #888; margin-top: 6px; }
    #winner-table   { margin-top: 28px; border-collapse: collapse; font-size: 0.78rem; min-width: 260px; }
    #winner-table th { color: #2a2a2a; padding: 3px 14px; border-bottom: 1px solid #1e1e1e; font-weight: normal; text-align: left; }
    #winner-table td { padding: 5px 14px; border-bottom: 1px solid #191919; text-align: left; }
    #winner-table tr.w-first td { color: #f0c040; }
    #winner-table tr.w-out   td { color: #2a2a2a; }
    #winner-dismiss { margin-top: 32px; font-size: 0.65rem; color: #2a2a2a; letter-spacing: 2px; cursor: pointer; }
    #winner-dismiss:hover { color: #555; }

    @keyframes trophy-bounce {
      from { transform: translateY(0)   scale(1); }
      to   { transform: translateY(-12px) scale(1.08); }
    }
  </style>
</head>
<body>

  <div id="bounty-event-banner">
    <div id="beb-icon"></div>
    <div id="beb-title"></div>
    <div id="beb-name"></div>
    <div id="beb-detail"></div>
  </div>

  <div id="table-winner-banner">
    <div class="twb-trophy">🏆</div>
    <div class="twb-table" id="twb-table"></div>
    <div class="twb-name"  id="twb-name"></div>
    <div class="twb-sub">Advancing to the final table</div>
  </div>

  <div id="countdown-overlay">
    <div id="cd-num">—</div>
    <div id="cd-label">TOURNAMENT STARTING</div>
    <div id="cd-agents"></div>
  </div>

  <div id="winner-overlay">
    <div id="winner-trophy">🏆</div>
    <div id="winner-label">Tournament Winner</div>
    <div id="winner-name"></div>
    <div id="winner-stack"></div>
    <table id="winner-table">
      <thead><tr><th>#</th><th>Agent</th><th>Final Stack</th></tr></thead>
      <tbody id="winner-tbody"></tbody>
    </table>
    <div id="winner-dismiss">click anywhere to dismiss</div>
  </div>

  <div id="header">
    <span id="title">♠ POKER TOURNAMENT ♠</span>
    <span id="conn" class="off">● disconnected</span>
  </div>

  <div id="main-content">
    <div id="table-sidebar">
      <div class="tl-header">Tables</div>
      <div id="table-list"></div>
    </div>

    <div id="bounty-bar">
      <span id="bounty-icon">💰</span>
      <span id="bounty-label">Bounty</span>
      <span id="bounty-name"></span>
      <span id="bounty-reward-text"></span>
      <span id="bounty-hands"></span>
    </div>

    <div id="table-area">
      <div id="felt">
        <div id="table-center">
          <div id="stage-label">WAITING</div>
          <div id="community-cards"></div>
          <div id="pot-display"></div>
        </div>
        <div id="hand-banner"></div>
        <div id="waiting">Waiting for tournament to start…</div>
      </div>
    </div>
    <div id="blinds-label"></div>
  </div><!-- #main-content -->

  <div id="bottom">
    <div class="panel">
      <h2>Standings</h2>
      <table id="standings-table">
        <thead><tr><th>#</th><th>Agent</th><th>Stack</th><th></th></tr></thead>
        <tbody id="standings-body"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Hand Log</h2>
      <div id="log"></div>
    </div>
  </div>

  <script>
    const KEY    = new URLSearchParams(location.search).get('key') || ''
    const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/spectate${KEY ? '?key=' + encodeURIComponent(KEY) : ''}`

    const RANKS = { 14:'A', 13:'K', 12:'Q', 11:'J', 10:'T' }
    const SUITS = { s:'♠', h:'♥', d:'♦', c:'♣' }
    const RED   = new Set(['h','d'])

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function cardHtml(card, cls) {
      const r = RANKS[card.rank] ?? card.rank
      const s = SUITS[card.suit]
      const col = RED.has(card.suit) ? 'red' : 'black'
      return `<div class="card ${cls} ${col}"><span class="r">${r}</span><span class="s">${s}</span></div>`
    }
    function backHtml() {
      return '<div class="card h-card back"></div>'
    }

    let lastState = null
    const tableStates = new Map()    // tableId → TableStateMsg
    let activeTableId  = null        // currently displayed table
    let pinnedTableId  = null        // null = auto-follow most recent update
    let activeTablesFromServer = []  // from tournament_update.activeTables
    let activeBountyTargetId   = null  // currently wanted player (or null)

    // ── Seat layout ───────────────────────────────────────────────────────────

    function positionSeats(state) {
      document.querySelectorAll('.seat').forEach(e => e.remove())
      if (!state || !state.players.length) return

      const ta   = document.getElementById('table-area')
      const felt = document.getElementById('felt')
      const taR  = ta.getBoundingClientRect()
      const fR   = felt.getBoundingClientRect()

      // Seat centers sit just outside the felt oval
      const cx = fR.left - taR.left + fR.width  / 2
      const cy = fR.top  - taR.top  + fR.height / 2
      const rx = fR.width  / 2 + 74  // horizontal radius to seat center
      const ry = fR.height / 2 + 64  // vertical radius to seat center
      const n  = state.players.length

      state.players.forEach((p, i) => {
        const angle = (2 * Math.PI * i / n) - Math.PI / 2
        const x = cx + rx * Math.cos(angle)
        const y = cy + ry * Math.sin(angle)

        const boxCls = ['seat-box']
        if (p.isActing)           boxCls.push('acting')
        if (p.folded)             boxCls.push('folded')
        if (p.connected === false) boxCls.push('disconnected')
        if (p.isBountyTarget)     boxCls.push('bounty-target')

        let cardsHtml = ''
        if (p.holeCards && p.holeCards.length >= 2 && !p.folded) {
          cardsHtml = p.holeCards.map(c => cardHtml(c, 'h-card')).join('')
        } else if (!p.folded) {
          cardsHtml = backHtml() + backHtml()
        }

        const la = (p.lastAction ?? '').toUpperCase()
        let actionCls = ''
        if (la.startsWith('FOLD'))  actionCls = 'fold'
        else if (la.startsWith('CALL'))  actionCls = 'call'
        else if (la.startsWith('CHECK')) actionCls = 'check'
        else if (la.startsWith('RAISE')) actionCls = 'raise'

        const betText  = p.allIn ? 'ALL IN' : p.bet > 0 ? `bet: ${p.bet}` : ''
        const dealerEl = p.isDealer ? '<span class="dealer-btn">D</span>' : ''
        const rawName  = p.id.length > 13 ? p.id.slice(0,13) + '…' : p.id
        const name     = esc(rawName)
        const dcEl     = p.connected === false ? '<div class="seat-dc">&#x2715; disconnected</div>' : ''

        const el = document.createElement('div')
        el.className = 'seat'
        el.style.left = x + 'px'
        el.style.top  = y + 'px'
        el.innerHTML = `<div class="${boxCls.join(' ')}">
          <div class="seat-name">${name}${dealerEl}</div>
          <div class="seat-stack">${p.stack.toLocaleString()}</div>
          <div class="seat-bet">${betText}</div>
          <div class="seat-cards">${cardsHtml}</div>
          <div class="seat-action ${actionCls}">${p.lastAction ?? ''}</div>
          ${dcEl}
        </div>`
        ta.appendChild(el)
      })
    }

    // ── Lobby seat layout (pre-game) ─────────────────────────────────────────

    function renderLobbySeats(agents) {
      document.querySelectorAll('.seat').forEach(e => e.remove())
      if (!agents.length) {
        document.getElementById('waiting').style.display = ''
        return
      }
      document.getElementById('waiting').style.display = 'none'

      const ta   = document.getElementById('table-area')
      const felt = document.getElementById('felt')
      const taR  = ta.getBoundingClientRect()
      const fR   = felt.getBoundingClientRect()
      const cx = fR.left - taR.left + fR.width  / 2
      const cy = fR.top  - taR.top  + fR.height / 2
      const rx = fR.width  / 2 + 74
      const ry = fR.height / 2 + 64
      const n  = agents.length

      agents.forEach((agent, i) => {
        const angle = (2 * Math.PI * i / n) - Math.PI / 2
        const x = cx + rx * Math.cos(angle)
        const y = cy + ry * Math.sin(angle)
        const name = esc(agent.id.length > 13 ? agent.id.slice(0, 13) + '…' : agent.id)
        const el = document.createElement('div')
        el.className = 'seat'
        el.style.left = x + 'px'
        el.style.top  = y + 'px'
        el.innerHTML = `<div class="seat-box waiting">
          <div class="seat-name">${name}</div>
          <div class="seat-waiting">waiting…</div>
        </div>`
        ta.appendChild(el)
      })
    }

    // ── Message handlers ──────────────────────────────────────────────────────

    // ── Table sidebar ─────────────────────────────────────────────────────────

    function renderTableList() {
      const sidebar = document.getElementById('table-sidebar')
      if (activeTablesFromServer.length <= 1) {
        sidebar.classList.remove('show')
        return
      }
      sidebar.classList.add('show')
      document.getElementById('table-list').innerHTML = activeTablesFromServer.map(tid => {
        const ts          = tableStates.get(tid)
        const playerCount = ts ? ts.players.length : '—'
        const isActive    = tid === activeTableId
        const label       = esc(tid.replace('table-', 'Table '))
        return `<div class="table-list-item${isActive ? ' active' : ''}" onclick="selectTable(${JSON.stringify(tid)})">
          <div class="tli-name${isActive ? '' : ' dim'}">${label}</div>
          <div class="tli-players">${playerCount} players</div>
        </div>`
      }).join('')
    }

    function selectTable(tableId) {
      pinnedTableId = tableId
      activeTableId = tableId
      const ts = tableStates.get(tableId)
      if (ts) renderTableState(ts)
      renderTableList()
    }

    // ── Bounty handlers ───────────────────────────────────────────────────────

    function updateBountyBar(targetName, reward, handsLeft) {
      document.getElementById('bounty-name').textContent        = targetName
      document.getElementById('bounty-reward-text').textContent = `+${reward} chips`
      document.getElementById('bounty-hands').textContent       = handsLeft != null ? `(${handsLeft} hands left)` : ''
      document.getElementById('bounty-bar').classList.add('show')
    }

    function clearBountyBar() {
      document.getElementById('bounty-bar').classList.remove('show')
    }

    function showBountyEventBanner(type, title, name, detail, durationMs) {
      const el = document.getElementById('bounty-event-banner')
      el.className = type  // 'claimed' or 'expired'
      document.getElementById('beb-icon').textContent   = type === 'claimed' ? '💰' : '⌛'
      document.getElementById('beb-title').textContent  = title
      document.getElementById('beb-name').textContent   = name
      document.getElementById('beb-detail').textContent = detail
      el.style.display   = 'block'
      el.style.animation = 'none'
      void el.offsetWidth
      el.style.animation = `beb-fadeout ${durationMs / 1000}s ease-out forwards`
      setTimeout(() => { el.style.display = 'none' }, durationMs)
    }

    function onBountyAnnounced(msg) {
      activeBountyTargetId = msg.targetId
      const handsLeft = msg.expiresAfterHand - msg.handNumber
      updateBountyBar(msg.targetName, msg.reward, handsLeft)
      addLog(`💰 BOUNTY: Eliminate ${esc(msg.targetName)} within ${handsLeft} hands for +${msg.reward} chips`, 'win')
    }

    function onBountyClaimed(msg) {
      activeBountyTargetId = null
      clearBountyBar()
      showBountyEventBanner(
        'claimed',
        'Bounty Claimed!',
        esc(msg.claimedByName),
        `eliminated ${esc(msg.targetName)} — +${msg.reward} chips`,
        4000
      )
      addLog(`💰 ${esc(msg.claimedByName)} claimed the bounty on ${esc(msg.targetName)} (+${msg.reward} chips)`, 'win')
    }

    function onBountyExpired(msg) {
      activeBountyTargetId = null
      clearBountyBar()
      showBountyEventBanner(
        'expired',
        'Bounty Expired',
        esc(msg.targetName),
        'survived — no reward claimed',
        3000
      )
      addLog(`⌛ Bounty on ${esc(msg.targetName)} expired unclaimed`, '')
    }

    function showTableWinnerBanner(msg) {
      const tableLabel = msg.tableId.replace('table-', 'Table ')
      document.getElementById('twb-table').textContent = tableLabel + ' Winner'
      document.getElementById('twb-name').textContent  = msg.winnerName
      const el = document.getElementById('table-winner-banner')
      el.style.display   = 'block'
      el.style.animation = 'none'
      void el.offsetWidth
      el.style.animation = ''
      setTimeout(() => { el.style.display = 'none' }, 3600)
      addLog(`${tableLabel} winner: ${esc(msg.winnerName)} — advancing to the final table`, 'win')
    }

    function flashHandBanner(n) {
      const el = document.getElementById('hand-banner')
      el.textContent = `HAND  #${n}`
      el.style.display = 'block'
      el.style.animation = 'none'
      void el.offsetWidth                  // force reflow to restart CSS animation
      el.style.animation = ''
      setTimeout(() => { el.style.display = 'none' }, 1500)
    }

    // ── Table state render ────────────────────────────────────────────────────

    function renderTableState(msg) {
      lastState = msg
      document.getElementById('waiting').style.display = 'none'
      document.getElementById('stage-label').textContent =
        (activeTablesFromServer.length > 1
          ? msg.tableId.replace('table-', 'Table ') + '  ·  '
          : '') + msg.stage.replace(/_/g, ' ')
      document.getElementById('pot-display').textContent =
        msg.pot > 0 ? `POT  ${msg.pot.toLocaleString()}` : ''

      const comm = document.getElementById('community-cards')
      comm.innerHTML = msg.communityCards.length
        ? msg.communityCards.map(c => cardHtml(c, 'c-card')).join('')
        : ''

      positionSeats(msg)
    }

    function onTableState(msg) {
      const prev = tableStates.get(msg.tableId)
      tableStates.set(msg.tableId, msg)

      // Auto-follow: latch onto the first table we see; don't thrash between
      // tables mid-game as concurrent updates arrive.  Only release the latch
      // if the active table disappears (handled in onStandings).
      if (!pinnedTableId && !activeTableId) activeTableId = msg.tableId

      if (activeTableId === msg.tableId) {
        // Flash hand banner when the hand number advances on the viewed table
        if (prev && msg.handNumber > prev.handNumber) flashHandBanner(msg.handNumber)
        renderTableState(msg)
      }
      // Always re-render tabs: a non-active table may have just come online
      renderTableList()
    }

    function onStandings(msg) {
      document.getElementById('countdown-overlay').classList.remove('show')
      const tbody = document.getElementById('standings-body')
      tbody.innerHTML = msg.standings.map((p, i) => {
        const cls  = p.eliminated ? 'out' : i === 0 ? 'leader' : ''
        const icon = p.eliminated ? '&#x2715;' : i === 0 ? '&#x265B;' : ''
        return `<tr class="${cls}">
          <td>${i+1}</td>
          <td>${esc(p.playerId)}</td>
          <td>${p.eliminated ? '&mdash;' : p.stack.toLocaleString()}</td>
          <td>${icon}</td>
        </tr>`
      }).join('')

      const blindsText = `Blinds ${msg.smallBlind} / ${msg.bigBlind}  ·  Level ${msg.blindLevel}`
      const tablesText = msg.tableCount > 1 ? `  ·  ${msg.tableCount} tables` : ''
      document.getElementById('blinds-label').textContent = blindsText + tablesText

      // Sync tab list — remove stale tables that no longer exist after consolidation
      if (msg.activeTables) {
        activeTablesFromServer = msg.activeTables
        for (const tid of tableStates.keys()) {
          if (!msg.activeTables.includes(tid)) tableStates.delete(tid)
        }
        if (pinnedTableId && !msg.activeTables.includes(pinnedTableId)) pinnedTableId = null
        // If the displayed table was removed, fall back to the first remaining one
        if (activeTableId && !msg.activeTables.includes(activeTableId)) {
          activeTableId = pinnedTableId ?? msg.activeTables[0] ?? null
          if (activeTableId) {
            const ts = tableStates.get(activeTableId)
            if (ts) renderTableState(ts)
          }
        }
        renderTableList()
      }
    }

    function addLog(text, cls) {
      const el = document.createElement('div')
      el.className = 'log-row' + (cls ? ' ' + cls : '')
      el.textContent = text
      const log = document.getElementById('log')
      log.prepend(el)
    }

    function onTournamentComplete(msg) {
      // Update standings panel with final placements
      const tbody = document.getElementById('standings-body')
      tbody.innerHTML = msg.standings.map((p, i) => {
        const cls  = i === 0 ? 'leader' : i === msg.standings.length - 1 ? 'out' : ''
        const icon = i === 0 ? '&#x265B;' : ''
        return `<tr class="${cls}">
          <td>${p.place}</td>
          <td>${esc(p.playerId)}</td>
          <td>${p.stack > 0 ? p.stack.toLocaleString() : '&mdash;'}</td>
          <td>${icon}</td>
        </tr>`
      }).join('')

      // Update seats to show final stacks (no cards, no active state)
      if (lastState) {
        const finalState = {
          ...lastState,
          players: lastState.players.map(p => {
            const final = msg.standings.find(s => s.playerId === p.id)
            return { ...p, isActing: false, lastAction: '', holeCards: [],
                     stack: final ? final.stack : p.stack }
          }),
          communityCards: [],
          pot: 0,
        }
        document.getElementById('stage-label').textContent = 'FINISHED'
        document.getElementById('pot-display').textContent = ''
        document.getElementById('community-cards').innerHTML = ''
        positionSeats(finalState)
      }

      // Show winner overlay
      document.getElementById('winner-name').textContent  = msg.winnerName
      document.getElementById('winner-stack').textContent = `${msg.finalStack.toLocaleString()} chips`
      document.getElementById('winner-tbody').innerHTML = msg.standings.map(p => {
        const cls = p.place === 1 ? 'w-first' : p.stack === 0 ? 'w-out' : ''
        return `<tr class="${cls}">
          <td>#${p.place}</td>
          <td>${esc(p.playerId)}</td>
          <td>${p.stack > 0 ? p.stack.toLocaleString() : '&mdash;'}</td>
        </tr>`
      }).join('')
      document.getElementById('winner-overlay').classList.add('show')
    }

    function handleMessage(msg) {
      if (msg.type === 'countdown') {
        // Reset table tracking whenever a (new) countdown arrives
        tableStates.clear()
        activeTableId        = null
        pinnedTableId        = null
        activeTablesFromServer = []
        activeBountyTargetId = null
        clearBountyBar()
        renderTableList()
        document.getElementById('winner-overlay').classList.remove('show')
        document.getElementById('countdown-overlay').classList.add('show')
        document.getElementById('cd-num').textContent =
          msg.secondsRemaining > 0 ? msg.secondsRemaining : 'GO!'
        document.getElementById('cd-agents').textContent =
          msg.agentCount + ' agent' + (msg.agentCount !== 1 ? 's' : '') + ' connected'
        if (msg.secondsRemaining === 0) {
          setTimeout(() => document.getElementById('countdown-overlay').classList.remove('show'), 2000)
        }
      }
      if (msg.type === 'lobby_snapshot') renderLobbySeats(msg.agents)
      if (msg.type === 'tournament_update') onStandings(msg)
      if (msg.type === 'table_state') {
        document.getElementById('countdown-overlay').classList.remove('show')
        onTableState(msg)
      }
      if (msg.type === 'hand_result') {
        const wins = msg.winners.map(w => `${w.playerId} +${w.amount}`).join(', ')
        addLog(`Hand #${msg.handNumber}: ${wins}`, 'win')
      }
      if (msg.type === 'bounty_announced')   onBountyAnnounced(msg)
      if (msg.type === 'bounty_claimed')     onBountyClaimed(msg)
      if (msg.type === 'bounty_expired')     onBountyExpired(msg)
      if (msg.type === 'table_winner')       showTableWinnerBanner(msg)
      if (msg.type === 'tournament_complete') onTournamentComplete(msg)
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────

    function connect() {
      const ws = new WebSocket(WS_URL)
      ws.onopen = () => {
        document.getElementById('conn').textContent = '● connected'
        document.getElementById('conn').className = 'on'
      }
      ws.onclose = () => {
        document.getElementById('conn').textContent = '● disconnected'
        document.getElementById('conn').className = 'off'
        setTimeout(connect, 2000)
      }
      ws.onerror  = () => ws.close()
      ws.onmessage = e => handleMessage(JSON.parse(e.data))
    }

    // Dismiss winner overlay on click
    document.getElementById('winner-overlay').addEventListener('click', () => {
      document.getElementById('winner-overlay').classList.remove('show')
    })

    window.addEventListener('resize', () => { if (lastState) positionSeats(lastState) })
    connect()
  </script>
</body>
</html>
